plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.harshynative'
version = '0.1.0'

android {
  namespace "expo.modules.harshynative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.16.0"
  testImplementation "junit:junit:4.13.2"
}
